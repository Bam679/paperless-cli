# Throwaway Paperless-ngx for `make integration` only. Synthetic data, local
# sqlite, bound to a random 127.0.0.1 port, removed with `down -v`.
# The admin credentials are test-only placeholders, not secrets.
name: ${COMPOSE_PROJECT_NAME:-agent-cli-test-paperless}

services:
  broker:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: "no"

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
    restart: "no"
    depends_on: [broker]
    ports:
      - "127.0.0.1::8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-agent-cli-test-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-agent-cli-test-only}
      PAPERLESS_SECRET_KEY: agent-cli-test-only-insecure-key
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_OCR_MODE: skip
      PAPERLESS_OCR_SKIP_ARCHIVE_FILE: always
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "1"
      PAPERLESS_WEBSERVER_WORKERS: "1"
      PAPERLESS_ENABLE_UPDATE_CHECK: "false"
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "false"

volumes:
  data:
  media:
